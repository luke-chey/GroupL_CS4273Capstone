services:
  frontend:
    image: callanalysistool-frontend:latest
    build:
      context: ./frontend
      args:
        NODE_ENV: ${NODE_ENV}
        PORT: ${PORT_FRONTEND}
    restart: unless-stopped
    ports:
      - 3000:3000

  ollama:
    image: callanalysistool-ollama:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.ollama
      args:
        TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: ${TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD}
        OLLAMA_HOST: ${OLLAMA_HOST_OLLAMA}
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=${TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD}
      - OLLAMA_HOST=${OLLAMA_HOST_OLLAMA}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
    volumes:
      - ollama_data:/root/.ollama

  whisper:
    image: callanalysistool-whisper:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.whisper
      args:
        HF_HOME_PRELOAD: ${HF_HOME_PRELOAD}
        TRANSFORMERS_CACHE_PRELOAD: ${TRANSFORMERS_CACHE_PRELOAD}
        SENTENCE_TRANSFORMERS_HOME_PRELOAD: ${SENTENCE_TRANSFORMERS_HOME_PRELOAD}
        TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: ${TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD}
        HF_HOME: ${HF_HOME}
        TRANSFORMERS_CACHE: ${TRANSFORMERS_CACHE}
        SENTENCE_TRANSFORMERS_HOME: ${SENTENCE_TRANSFORMERS_HOME}
    restart: unless-stopped
    environment:
      - TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=${TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD}
    volumes:
      - whisperx_cache:/root/.cache/huggingface
      - models_data:/app/models
      - torch_cache:/root/.cache/torch

  backend:
    image: callanalysistool-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.flask
      args:
        NLTK_DATA: ${NLTK_DATA}
        DOCKER_CONTAINER: ${DOCKER_CONTAINER}
        OLLAMA_HOST: ${OLLAMA_HOST_BACKEND}
        FLASK_ENV: ${FLASK_ENV}
        PORT: ${PORT_BACKEND}
    restart: unless-stopped
    depends_on:
      whisper:
        condition: service_started
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - OLLAMA_HOST=${OLLAMA_HOST_BACKEND}
      - DOCKER_CONTAINER=${DOCKER_CONTAINER}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE}
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=${HF_HOME}
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME}
      - TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=${TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD}
    volumes:
      - ./backend/data:/app/data:ro
      - ./backend/output:/app/output
      - whisperx_cache:/root/.cache/huggingface:rw
      - models_data:/app/models:ro
      - torch_cache:/root/.cache/torch

# Online deployment (creates own volumes)
# volumes:
#   whisperx_cache:
#   ollama_data:
#   models_data:
#   torch_cache:

# Offline deployment (uses existing volumes, follows export naming convention)
volumes:
  whisperx_cache:
    external: true
    name: callanalysistool_whisperx_cache
  ollama_data:
    external: true
    name: callanalysistool_ollama_data
  models_data:
    external: true
    name: callanalysistool_models_data
  torch_cache:
    external: true
    name: callanalysistool_torch_cache
